<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambio de Idioma</title>
<style>
  body {
    font-family: Poppins, sans-serif;
    background-color: #f0f0f0;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .language-selector {
    position: relative;
  }

  .selected {
    display: flex;
    align-items: center;
    background-color: white;
    border: 2px solid #ddd;
    padding: 8px 12px;
    border-radius: 12px;
    cursor: pointer;
    gap: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  .selected img {
    width: 25px;
    height: 25px;
    border-radius: 50%;
  }

  .dropdown {
    display: none;
    position: absolute;
    top: 45px;
    left: 0;
    background-color: white;
    border-radius: 10px;
    border: 1px solid #ddd;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    overflow: hidden;
    width: 160px;
    z-index: 100;
  }

  .dropdown div {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .dropdown div:hover {
    background-color: #f3f3f3;
  }

  .dropdown img {
    width: 25px;
    height: 25px;
    border-radius: 50%;
  }
</style>
</head>
<body>

<div class="language-selector">
  <div class="selected" id="selectedLang">
    <img src="https://flagcdn.com/w40/es.png" alt="Español">
    <span>Español</span>
  </div>

  <div class="dropdown" id="dropdown">
    <div onclick="changeLanguage('es')">
      <img src="https://flagcdn.com/w40/es.png" alt="Español">
      <span>Español</span>
    </div>
    <div onclick="changeLanguage('fr')">
      <img src="https://flagcdn.com/w40/fr.png" alt="Français">
      <span>Français</span>
    </div>
    <div onclick="changeLanguage('en')">
      <img src="https://flagcdn.com/w40/gb.png" alt="English">
      <span>English</span>
    </div>
  </div>
</div>

<script>
  const selected = document.getElementById('selectedLang');
  const dropdown = document.getElementById('dropdown');

  selected.onclick = () => {
    dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
  };

  function changeLanguage(lang) {
    // 🔗 Cambia las URLs a las de tus páginas
    if (lang === 'es') window.location.href = "index-es.html";
    if (lang === 'fr') window.location.href = "index-fr.html";
    if (lang === 'en') window.location.href = "index-en.html";
  }

  // Cerrar al hacer clic fuera
  document.addEventListener('click', (e) => {
    if (!selected.contains(e.target)) dropdown.style.display = 'none';
  });
</script>

</body>
</html>
