<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Selector de idioma con banderas</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }

    .language-selector {
      position: relative;
      display: inline-block;
    }

    .selected-language {
      background-color: white;
      border: 1px solid #ccc;
      padding: 10px 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 5px;
    }

    .flag {
      width: 24px;
      height: 16px;
      object-fit: cover;
      border-radius: 3px;
    }

    .language-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-top: 5px;
      display: none;
      flex-direction: column;
      width: 100%;
      z-index: 10;
    }

    .language-option {
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .language-option:hover {
      background-color: #eee;
    }
  </style>
</head>
<body>

<div class="language-selector">
  <div class="selected-language" id="selectedLanguage">
    <img src="https://flagcdn.com/w40/es.png" alt="Español" class="flag" />
    Español
  </div>
  <div class="language-dropdown" id="languageDropdown" style="display:none; flex-direction: column;">
    <div class="language-option" data-lang="es" data-label="Español" data-flag="https://flagcdn.com/w40/es.png">
      <img src="https://flagcdn.com/w40/es.png" alt="Español" class="flag" />
      Español
    </div>
    <div class="language-option" data-lang="en" data-label="Inglés" data-flag="https://flagcdn.com/w40/gb.png">
      <img src="https://flagcdn.com/w40/gb.png" alt="Inglés" class="flag" />
      Inglés
    </div>
    <div class="language-option" data-lang="fr" data-label="Francés" data-flag="https://flagcdn.com/w40/fr.png">
      <img src="https://flagcdn.com/w40/fr.png" alt="Francés" class="flag" />
      Francés
    </div>
  </div>
</div>



<script src="script.js"></script>


</body>
</html>
